<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alee Farhat Productions | Creative Studio</title>

<meta name="description" content="Video editing agency: brand reels, real estate reels and storytelling videos.">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0e0d0b;
  --surface: #1a1712;
  --ink: #f5efe0;
  --mute: #b0a690;
  --line: #3a3220;
  --accent: #d4af37;
  --accent-ink: #1a1405;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Poppins', sans-serif;
  line-height: 1.6;
}

a {
  color: inherit;
  text-decoration: none;
}

.wrap {
  max-width: 1120px;
  margin: auto;
  padding: 0 20px;
}

header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}

.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 64px;
}

.nav nav {
  display: flex;
  gap: 22px;
  font-size: 14px;
}

.nav nav a:hover {
  color: var(--accent);
}

.btn {
  display: inline-block;
  padding: 12px 24px;
  border-radius: 999px;
  font-weight: 600;
  background: linear-gradient(135deg,#f6e08a,#d4af37,#a67c1a);
  color: var(--accent-ink);
}

.btn.ghost {
  background: transparent;
  color: var(--accent);
  border: 1px solid var(--accent);
}

.hero {
  padding: 80px 20px 64px;
  text-align: center;
  background: radial-gradient(
    ellipse at 50% 0%,
    rgba(212,175,55,.18),
    transparent 65%
  );
}

.hero img {
  width: min(520px,80%);
}

.hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(28px,5vw,48px);
  line-height: 1.15;
}

.hero p {
  color: var(--mute);
  max-width: 560px;
  margin: 0 auto 28px;
}

.gold {
  color: var(--accent);
}

section {
  padding: 56px 0;
}

h2 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(26px,4vw,38px);
}

.sub {
  color: var(--mute);
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(210px,1fr));
  gap: 18px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 28px;
}

.card:hover {
  border-color: var(--accent);
}

.vid {
  position: relative;
  border-radius: 16px;
  overflow: hidden;
  background: #1a1712;
  aspect-ratio: 9/16;
  cursor: pointer;
}

.vid iframe {
  width: 100%;
  height: 100%;
  border: 0;
}

footer {
  border-top: 1px solid var(--line);
  padding: 26px 0;
  text-align: center;
  color: var(--mute);
}

@media(max-width:760px) {
  .nav nav {
    display: none;
  }

  .grid {
    grid-template-columns: repeat(2,1fr);
  }
}
</style>
</head>
